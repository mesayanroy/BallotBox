<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" width="1500" height="500" role="img" aria-labelledby="t">
  <title id="t">Maao — Vote privately. Verify publicly.</title>
  <defs>
    <linearGradient id="maao-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5fe3c8"/>
      <stop offset="1" stop-color="#8b93ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#1b2150"/>
      <stop offset="1" stop-color="#070918"/>
    </radialGradient>
  </defs>
  <rect width="1500" height="500" fill="url(#glow)"/>
  <!-- keep the lower-left clear: X overlays the avatar there -->
  <g font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace">
    <!-- left slip: what the voter sees -->
    <g transform="translate(560 100)">
      <rect width="240" height="280" rx="14" fill="#10132b" stroke="#2a2f5c" stroke-width="3"/>
      <text x="26" y="50" font-size="20" font-weight="700" fill="#eef0ff">YOUR BALLOT</text>
      <line x1="26" y1="68" x2="214" y2="68" stroke="#2a2f5c" stroke-width="3"/>
      <rect x="26" y="98" width="32" height="32" rx="6" fill="none" stroke="#5fe3c8" stroke-width="4"/>
      <path d="M32 114 l8 9 l20 -26" fill="none" stroke="#5fe3c8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="76" y="122" font-size="22" fill="#eef0ff">Yes</text>
      <rect x="26" y="156" width="32" height="32" rx="6" fill="none" stroke="#676c8f" stroke-width="4"/>
      <text x="76" y="180" font-size="22" fill="#a8aed3">No</text>
      <line x1="26" y1="230" x2="160" y2="230" stroke="#2a2f5c" stroke-width="3"/>
    </g>
    <!-- right slip: what the chain sees -->
    <g transform="translate(1080 100)">
      <rect width="240" height="280" rx="14" fill="#10132b" stroke="#2a2f5c" stroke-width="3"/>
      <text x="26" y="50" font-size="20" font-weight="700" fill="#eef0ff">ON-CHAIN</text>
      <line x1="26" y1="68" x2="214" y2="68" stroke="#2a2f5c" stroke-width="3"/>
      <text x="26" y="122" font-size="18" fill="#8b93ff">a91f·3c07·e2d4</text>
      <text x="26" y="152" font-size="18" fill="#8b93ff">58b0·7f1a·c6e9</text>
      <text x="26" y="182" font-size="18" fill="#8b93ff">0d42·9be3·17fa</text>
      <line x1="26" y1="230" x2="160" y2="230" stroke="#2a2f5c" stroke-width="3"/>
    </g>
    <text x="940" y="236" text-anchor="middle" font-size="20" font-style="italic" fill="#a8aed3">zero-knowledge</text>
    <text x="940" y="266" text-anchor="middle" font-size="26" fill="#5fe3c8">→</text>
  </g>
  <!-- mark + wordmark -->
  <g transform="translate(60 74) scale(0.3)">
    <rect width="400" height="400" rx="92" fill="#10132b"/>
    <path d="M104 286 V124 L200 226 L296 124 V286" fill="none" stroke="url(#maao-g)" stroke-width="42" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="200" cy="304" r="22" fill="#5fe3c8"/>
  </g>
  <g font-family="Georgia, 'Times New Roman', serif" fill="#ffffff">
    <text x="196" y="146" font-size="64" font-style="italic" font-weight="700">Maao</text>
    <text x="60" y="230" font-size="28">Vote privately.</text>
    <text x="60" y="268" font-size="28">Verify publicly.</text>
  </g>
  <text x="60" y="318" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="17" fill="#5fe3c8">LIVE ON MIDNIGHT PREPROD · @Maao</text>
  <line x1="0" y1="496" x2="1500" y2="496" stroke="#5fe3c8" stroke-width="8"/>
</svg>
